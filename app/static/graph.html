<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidence Constellation</title>
  <script src="/static/d3.min.js"></script>
  <style>
    :root { --ink:#18201c; --paper:#f3efdf; --rust:#bc4e2c; --moss:#31614c; --acid:#e3c84c; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 70% 15%,#fff9d4,transparent 28rem),repeating-linear-gradient(0deg,transparent 0 31px,#d8d2bb 32px),var(--paper); font-family:"Avenir Next",sans-serif; }
    header { position:fixed; z-index:2; top:24px; left:28px; max-width:330px; padding:18px 20px; border:1px solid var(--ink); background:rgba(243,239,223,.92); box-shadow:7px 7px 0 var(--ink); }
    h1 { margin:0; font:700 2rem/1 Georgia,serif; }
    p { margin:9px 0 0; color:#526058; font-size:.8rem; line-height:1.45; }
    svg { width:100vw; height:100vh; }
    .link { stroke:#9b9278; stroke-opacity:.42; }
    .node { cursor:grab; stroke:var(--ink); stroke-width:1.3; }
    .node.document { fill:var(--rust); }
    .node.concept { fill:var(--acid); }
    text { pointer-events:none; fill:var(--ink); font-size:11px; font-weight:700; paint-order:stroke; stroke:var(--paper); stroke-width:4px; }
    .tip { position:fixed; pointer-events:none; opacity:0; padding:8px 10px; border:1px solid var(--ink); background:var(--ink); color:#fff; font-size:12px; }
  </style>
</head>
<body>
  <header><h1>Evidence Constellation</h1><p>Documents are rust-red anchors. Extracted concepts orbit in yellow. Drag nodes, zoom the field, and hover an edge to see the cited page.</p></header>
  <svg aria-label="Knowledge graph"></svg><div class="tip"></div>
  <script>
    const svg=d3.select("svg"), tip=d3.select(".tip"), width=innerWidth, height=innerHeight;
    const root=svg.append("g"); svg.call(d3.zoom().scaleExtent([.35,4]).on("zoom",e=>root.attr("transform",e.transform)));
    fetch("/graph").then(r=>r.json()).then(data=>{
      const simulation=d3.forceSimulation(data.nodes).force("link",d3.forceLink(data.links).id(d=>d.id).distance(105)).force("charge",d3.forceManyBody().strength(-280)).force("center",d3.forceCenter(width/2,height/2)).force("collide",d3.forceCollide().radius(d=>d.type==="document"?38:22));
      const links=root.append("g").selectAll("line").data(data.links).join("line").attr("class","link").attr("stroke-width",d=>d.page?2:1).on("mousemove",(e,d)=>tip.style("opacity",1).style("left",`${e.clientX+12}px`).style("top",`${e.clientY+12}px`).text(`Evidence on page ${d.page}`)).on("mouseleave",()=>tip.style("opacity",0));
      const nodes=root.append("g").selectAll("circle").data(data.nodes).join("circle").attr("class",d=>`node ${d.type}`).attr("r",d=>d.type==="document"?18:9).call(d3.drag().on("start",(e,d)=>{if(!e.active)simulation.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}));
      const labels=root.append("g").selectAll("text").data(data.nodes).join("text").attr("dx",d=>d.type==="document"?23:13).attr("dy",4).text(d=>d.label);
      simulation.on("tick",()=>{links.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);nodes.attr("cx",d=>d.x).attr("cy",d=>d.y);labels.attr("x",d=>d.x).attr("y",d=>d.y)});
    }).catch(error=>d3.select("header p").text(`Graph unavailable: ${error.message}. Index documents first.`));
  </script>
</body>
</html>

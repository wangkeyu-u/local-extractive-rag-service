name: RAG checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build -t local-extractive-rag-test .
      - name: Verify image contains default corpus
        run: >-
          docker run --rm local-extractive-rag-test python -c
          "from app.rag import build_index; assert build_index()['documents_indexed'] == 5"
